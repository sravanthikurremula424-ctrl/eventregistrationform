!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Registration</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <form id="registrationForm" class="registration-form">
            <h2>Event Registration</h2>
            <p>Register now to reserve your spot.</p>

            <label for="name">Full Name</label>
            <input type="text" id="name" placeholder="Enter your name" required>

            <label for="email">Email Address</label>
            <input type="email" id="email" placeholder="Enter your email" required>

            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" placeholder="Enter your phone number" required>

            <label for="event">Select Event</label>
            <select id="event" required>
                <option value="">-- Select an event --</option>
                <option value="Tech Conference">Tech Conference</option>
                <option value="Music Festival">Music Festival</option>
                <option value="Business Workshop">Business Workshop</option>
                <option value="Sports Meet">Sports Meet</option>
            </select>

            <label for="date">Event Date</label>
            <input type="date" id="date" required>

            <label for="message">Message (Optional)</label>
            <textarea id="message" rows="4" placeholder="Any special requirements?"></textarea>

            <button type="submit">Register Now</button>

            <div id="successMessage" class="success-message"></div>
        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
